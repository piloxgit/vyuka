  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation with Mkdocs
mkdocs:
   configuration: mkdocs.yml

# Povolení instalace doplňků ze souboru requirements.txt
python:
   install:
   - requirements: requirements.txt
