<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="690" viewBox="0 0 1100 690">
  <rect width="1100" height="690" fill="#ffffff"/>
  <text x="550" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2937">Podrobnější VA charakteristika běžné LED</text>
  <text x="550" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">Orientační hodnoty pro běžnou indikační LED</text>

  <!-- Zakázané oblasti -->
  <rect x="75" y="105" width="92" height="470" fill="#fee2e2"/>
  <rect x="75" y="105" width="945" height="82" fill="#fee2e2" opacity="0.82"/>

  <!-- Osy: U = -6 až +4 V, I = -2 až +24 mA -->
  <line x1="75" y1="535" x2="1020" y2="535" stroke="#111827" stroke-width="3"/>
  <line x1="642" y1="575" x2="642" y2="105" stroke="#111827" stroke-width="3"/>
  <polygon points="1020,535 998,524 998,546" fill="#111827"/>
  <polygon points="642,105 631,127 653,127" fill="#111827"/>

  <!-- Pomocná mřížka -->
  <g stroke="#d1d5db" stroke-width="1">
    <line x1="75" y1="453" x2="1020" y2="453"/>
    <line x1="75" y1="371" x2="1020" y2="371"/>
    <line x1="75" y1="289" x2="1020" y2="289"/>
    <line x1="75" y1="207" x2="1020" y2="207"/>
    <line x1="75" y1="575" x2="1020" y2="575"/>
    <line x1="167" y1="105" x2="167" y2="575"/>
    <line x1="262" y1="105" x2="262" y2="575"/>
    <line x1="356" y1="105" x2="356" y2="575"/>
    <line x1="451" y1="105" x2="451" y2="575"/>
    <line x1="545" y1="105" x2="545" y2="575"/>
    <line x1="736" y1="105" x2="736" y2="575"/>
    <line x1="831" y1="105" x2="831" y2="575"/>
    <line x1="925" y1="105" x2="925" y2="575"/>
  </g>

  <!-- Limity -->
  <line x1="167" y1="105" x2="167" y2="575" stroke="#dc2626" stroke-width="4" stroke-dasharray="12 9"/>
  <line x1="75" y1="207" x2="1020" y2="207" stroke="#dc2626" stroke-width="4" stroke-dasharray="12 9"/>

  <!-- Charakteristika -->
  <path d="M170 575 C210 548 350 540 500 538 C560 537 610 536 642 535 C720 534 785 532 820 525 C850 519 870 503 884 470 C900 432 910 370 920 305 C928 253 938 198 952 142" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>

  <!-- Popisky os -->
  <g font-family="Arial, sans-serif" font-size="17" fill="#374151">
    <text x="62" y="541" text-anchor="end">0</text>
    <text x="62" y="581" text-anchor="end">−2</text>
    <text x="62" y="459" text-anchor="end">5</text>
    <text x="62" y="377" text-anchor="end">10</text>
    <text x="62" y="295" text-anchor="end">15</text>
    <text x="62" y="213" text-anchor="end">20</text>
    <text x="62" y="131" text-anchor="end">25</text>

    <text x="75" y="603" text-anchor="middle">−6</text>
    <text x="167" y="603" text-anchor="middle">−5</text>
    <text x="262" y="603" text-anchor="middle">−4</text>
    <text x="356" y="603" text-anchor="middle">−3</text>
    <text x="451" y="603" text-anchor="middle">−2</text>
    <text x="545" y="603" text-anchor="middle">−1</text>
    <text x="642" y="603" text-anchor="middle">0</text>
    <text x="736" y="603" text-anchor="middle">1</text>
    <text x="831" y="603" text-anchor="middle">2</text>
    <text x="925" y="603" text-anchor="middle">3</text>
    <text x="1015" y="603" text-anchor="middle">4 V</text>
  </g>

  <text x="920" y="647" text-anchor="end" font-family="Arial, sans-serif" font-size="21" fill="#111827">Napětí na LED U</text>
  <text transform="translate(24 385) rotate(-90)" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#111827">Proud LED I (mA)</text>

  <!-- Vysvětlivky -->
  <text x="118" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">NEPOVOLENÁ</text>
  <text x="118" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#b91c1c">OBLAST</text>
  <text x="178" y="635" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">Max. závěrné napětí přibližně −5 V</text>

  <text x="420" y="174" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#b91c1c">Nad přibližně 20 mA hrozí poškození LED</text>
  <text x="664" y="514" font-family="Arial, sans-serif" font-size="17" fill="#374151">LED ještě nesvítí</text>
  <text x="812" y="492" font-family="Arial, sans-serif" font-size="17" fill="#1d4ed8">proud prudce roste</text>
  <text x="335" y="522" font-family="Arial, sans-serif" font-size="17" fill="#374151">závěrný proud je téměř nulový</text>

  <!-- Legenda -->
  <line x1="705" y1="112" x2="755" y2="112" stroke="#2563eb" stroke-width="7"/>
  <text x="765" y="119" font-family="Arial, sans-serif" font-size="17" fill="#374151">průběh proudu LED</text>
  <line x1="705" y1="145" x2="755" y2="145" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 7"/>
  <text x="765" y="152" font-family="Arial, sans-serif" font-size="17" fill="#374151">mezní hodnota</text>
</svg>
