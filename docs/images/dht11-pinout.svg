<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="title desc">
  <title id="title">Piny senzoru DHT11</title>
  <desc id="desc">Piny zleva doprava jsou VCC, DATA, nezapojovat a GND.</desc>
  <rect width="700" height="300" fill="#f5f7f2"/>
  <text x="350" y="45" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="bold" fill="#242b2d">DHT11, pohled zepředu</text>
  <rect x="195" y="85" width="310" height="105" rx="18" fill="#e8a33a"/>
  <path d="M225 85 v-28 M315 85 v-28 M405 85 v-28 M475 85 v-28" stroke="#343a40" stroke-width="8"/>
  <circle cx="225" cy="57" r="7" fill="#c94c4c"/>
  <circle cx="315" cy="57" r="7" fill="#3d75b9"/>
  <circle cx="405" cy="57" r="7" fill="#999"/>
  <circle cx="475" cy="57" r="7" fill="#343a40"/>
  <text x="225" y="235" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#c94c4c">VCC / +</text>
  <text x="315" y="235" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#3d75b9">DATA</text>
  <text x="405" y="235" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#666">NC</text>
  <text x="475" y="235" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#343a40">GND / -</text>
  <text x="350" y="275" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#666">NC = nezapojovat</text>
</svg>