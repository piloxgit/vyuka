<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Zapojení Arduina Uno a senzoru DHT11</title>
  <desc id="desc">Arduino Uno je propojeno se senzorem DHT11 vodiči 5V, DATA na pin 2 a GND.</desc>
  <rect width="900" height="420" fill="#f5f7f2"/>
  <rect x="70" y="70" width="300" height="270" rx="12" fill="#168f8b"/>
  <text x="220" y="125" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">Arduino Uno</text>
  <rect x="110" y="175" width="120" height="34" fill="#d8e9e6"/>
  <text x="170" y="198" text-anchor="middle" font-family="sans-serif" font-size="19">5V</text>
  <rect x="110" y="230" width="120" height="34" fill="#d8e9e6"/>
  <text x="170" y="253" text-anchor="middle" font-family="sans-serif" font-size="19">D2</text>
  <rect x="110" y="285" width="120" height="34" fill="#d8e9e6"/>
  <text x="170" y="308" text-anchor="middle" font-family="sans-serif" font-size="19">GND</text>
  <rect x="610" y="115" width="190" height="190" rx="16" fill="#e8a33a"/>
  <text x="705" y="185" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#242b2d">DHT11</text>
  <text x="705" y="225" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#242b2d">teplota</text>
  <text x="705" y="252" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#242b2d">a vlhkost</text>
  <path d="M230 192 C370 192 470 150 610 150" fill="none" stroke="#c94c4c" stroke-width="6"/>
  <path d="M230 247 C390 247 460 205 610 205" fill="none" stroke="#3d75b9" stroke-width="6"/>
  <path d="M230 302 C370 302 470 260 610 260" fill="none" stroke="#343a40" stroke-width="6"/>
  <text x="450" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#c94c4c">napájení</text>
  <text x="450" y="198" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3d75b9">DATA</text>
  <text x="450" y="270" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#343a40">zem</text>
</svg>